<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>NateThePlot</title>
        <link rel="stylesheet" href="./styles/index.css">
        <link rel="icon" href="./favicon.ico" type="image/x-icon">
        <script type="module" src="./js/index.js"></script>
    </head>

    <style>
        @font-face {
            font-family: 'Recoleta';
            src: url('./Recoleta.otf') format('opentype');
            font-display: swap;
        }

        @font-face {
            font-family: 'Instrumental-Sans';
            src: url('./InstrumentalSans.ttf') format('woff2');
            font-display: swap;
        }

        body {
            overflow-x: hidden;
        }

        #error404 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 65vh;
            padding: 20px;
            text-align: center;
        }

        #error404 h1 {
            font-size: 7rem;
            margin-bottom: 1rem;
            font-family: Recoleta, serif;
            color: var(--primary-text-color);
        }

        #error404 h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-family: Recoleta, serif;
            color: var(--primary-text-color);
        }

        #error404 p {
            font-size: 1.5rem;
            color: #666;
            font-family: Instrumental-Sans, sans-serif;
            color: var(--secondary-text-color);
        }

    </style>

    <body>
        <div id="navbar"></div>

        <section id="error404">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>The page you are looking for does not exist.</p>
        </section>

        <footer>
            <div class="footer-content">
                <h2>Contact Me</h2>
                <a href="https://instagram.com/NateThePlot" target="_blank" rel="noopener noreferrer">
                    <img src="./images/instagram.png" alt="Instagram" class="social-icon">
                </a>
                <a href="https://tiktok.com/@natetheplot" target="_blank" rel="noopener noreferrer">
                    <img src="./images/tik-tok.png" alt="TikTok" class="social-icon">
                </a>
                <a href="https://youtube.com/@NateThePlot" target="_blank" rel="noopener noreferrer">
                    <img src="./images/youtube.png" alt="YouTube" class="social-icon">
                </a>
                <a href="https://wattpad.com/NateThePlot" target="_blank" rel="noopener noreferrer">
                    <img src="./images/wattpad.png" alt="Wattpad" class="social-icon">
                </a>
            </div>
            <p>&copy; <span id="currentYear"></span> NateThePlot. All rights reserved.</p>
        </footer>

        <script>
            document.getElementById('currentYear').textContent = new Date().getFullYear();
        </script>
    </body>

</html>
