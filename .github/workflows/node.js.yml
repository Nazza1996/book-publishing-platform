name: Node.js CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # Checkout the branch
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # Setup Node.js with caching
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install dependencies
      - run: npm ci
      - run: npm --prefix client ci
      - run: npm --prefix server ci

      # Build app
      - run: npm --prefix client run build --if-present
      - run: npm --prefix server run build --if-present

      # Step 5: Zip client/dist and server/dist
      - name: Zip client and server builds
        run: |
          mkdir -p release
          zip -r app-build.zip client/dist server/dist

      # Upload the build as artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-app-build
          path: app-build.zip
